[package]
name = "chinstrap"
version = "0.1.0"
edition = "2024"
description = "Chinstrap: a native GPUI recorder feature explorer for Linux"
license = "Apache-2.0"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "28d0a3547f16b9609b301b48ab363bfca649c864", default-features = false, features = ["wayland", "x11"] }
gstreamer = { version = "0.25.4", features = ["v1_26"] }
gstreamer-pbutils = { version = "0.25", features = ["v1_26"] } # Discoverer for --selftest
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast"] }
async-channel = "2"
smol = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer-app = { version = "0.25", features = ["v1_26"] } # appsink: transcription decode, previews
gstreamer-video = { version = "0.25", features = ["v1_26"] } # preview frame strides
# Live previews: gpui's RenderImage is built from these (same majors as gpui's own).
image = { version = "0.25", default-features = false }
smallvec = "1"
# Transcription (SPEC §12): whisper.cpp with the Vulkan backend. "raw-api" re-exports whisper-rs-sys
# for the ggml backend query and log hooks (§12.3, T3); inference only runs in --transcribe-worker.
whisper-rs = { version = "=0.16.0", features = ["vulkan", "raw-api"] }
# Explicit model download only: blocking HTTPS with rustls (ring, webpki-roots); no tokio.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"
libc = "0.2" # setpriority, prctl, getppid, kill, flock

[profile.release]
lto = "thin"
codegen-units = 1
